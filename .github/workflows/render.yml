name: Render on home PC

# Keeps 4 unposted ball races ready. Each run picks a fresh matchup, searches for a near tie
# (or a 1 to 3 s comeback), renders it on Jack's PC and commits it to videos/ + queue.json.
on:
  schedule:
    - cron: "17 10 * * *"   # daily top-up, 2:17am PT
  workflow_dispatch:
    inputs:
      test:
        description: "Test only: render one race and push a small preview to the test-previews branch (queues nothing)"
        type: boolean
        default: false
      pair:
        description: "Test only: force a pair like speedup__steady (blank = next in rotation)"
        default: ""
      mode:
        description: "Test only: force split, late or photo"
        default: ""
      count:
        description: "How many to render now (blank = top the queue up to 4 unposted)"
        default: ""

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: [self-hosted, render-pc]
    timeout-minutes: 180
    defaults:
      run:
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Python environment
        run: |
          [ -x .venv/Scripts/python.exe ] || python -m venv .venv
          .venv/Scripts/python.exe -m pip install -q -r generator/requirements.txt
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
      - name: Find ffmpeg
        run: |
          for d in /c/ffmpeg/bin "/c/Program Files/WinGet/Packages"/Gyan.FFmpeg*/*/bin; do
            if [ -f "$d/ffmpeg.exe" ]; then cygpath -w "$d" >> "$GITHUB_PATH"; exit 0; fi
          done
          command -v ffmpeg || { echo "::error::ffmpeg is not installed on the home PC"; exit 1; }

      - name: Test render (queues nothing)
        if: inputs.test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          start=$(date +%s)
          rm -rf generator/out prev && mkdir -p prev
          (cd generator && python daily.py --test --pair "${{ inputs.pair }}" --mode "${{ inputs.mode }}")
          for f in generator/out/*.mp4; do
            ffmpeg -v error -y -i "$f" -vf scale=540:-2 -c:v libx264 -crf 28 -preset veryfast -c:a aac -b:a 96k "prev/$(basename "$f")"
          done
          cp generator/out/*.json prev/ 2>/dev/null || true
          (cd prev && git init -q && git checkout -q -b test-previews && git add . \
            && git -c user.name=ballrace-bot -c user.email=actions@users.noreply.github.com commit -qm "Test preview" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-previews)
          echo "Test render took $(( $(date +%s) - start ))s on the home PC." >> "$GITHUB_STEP_SUMMARY"

      - name: Render and queue
        if: ${{ !inputs.test }}
        run: |
          left=$(python - <<'PY'
          import json
          q = json.load(open("queue.json")); done = {p["id"] for p in json.load(open("posted.json"))}
          print(sum(1 for x in q if x["id"] not in done))
          PY
          )
          n="${{ inputs.count }}"
          [ -n "$n" ] || n=$(( 4 - left ))
          echo "unposted: $left, rendering: $n"
          if [ "$n" -gt 0 ]; then (cd generator && python daily.py --count "$n"); fi
      - name: Save
        if: ${{ !inputs.test }}
        run: |
          git add videos queue.json generator/state.json
          git diff --cached --quiet && exit 0
          git -c user.name=ballrace-bot -c user.email=actions@users.noreply.github.com commit -m "Render new races on home PC"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
