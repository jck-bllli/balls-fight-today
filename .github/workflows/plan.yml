name: Plan matchups

on:
  schedule:
    - cron: "23 17 * * 0"   # Sundays: queue up the next 14 matchups (render.yml then renders them on the home PC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Plan
        run: |
          pip install -q pillow numpy
          python generator/plan.py 14
      - name: Save
        run: |
          git config user.name "ballrace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generator/matchups.json
          git diff --cached --quiet && exit 0
          git commit -m "Plan next matchups"
          git pull --rebase --autostash
          git push
