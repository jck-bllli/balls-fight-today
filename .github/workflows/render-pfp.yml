name: render-pfp
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pfp:
    runs-on: [self-hosted, render-pc]
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet pillow
      - run: python pfp/make_pfp.py pfp_out
      - run: |
          git config user.name "render-pc"
          git config user.email "render-pc@users.noreply.github.com"
          git checkout -B pfp-renders
          git add -f pfp_out
          git commit -m "pfp renders"
          git push -f origin pfp-renders
