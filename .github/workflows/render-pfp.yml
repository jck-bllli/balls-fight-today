name: render-pfp
on:
  push:
    branches: [claude/project-thread-fb6pgz]
    paths: [".github/workflows/render-pfp.yml", "pfp/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  pfp:
    runs-on: [self-hosted, render-pc]
    defaults:
      run:
        shell: C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false
      - name: Python environment
        run: |
          [ -x .venv/Scripts/python.exe ] || python -m venv .venv
          .venv/Scripts/python.exe -m pip install -q pillow
      - name: Render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf pfp_out
          .venv/Scripts/python.exe pfp/make_pfp.py pfp_out
          cp pfp_out/pfp_contact_sheet.jpg pfp_out/sheet.jpg
          rm -rf /tmp/pfpb && cp -r pfp_out /tmp/pfpb
          (cd /tmp/pfpb && git init -q && git checkout -q -b pfp-renders && git add . \
            && git -c user.name=render-pc -c user.email=actions@users.noreply.github.com commit -qm "pfp renders" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pfp-renders)
